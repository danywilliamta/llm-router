[project]
name = "llm-router"
version = "0.1.0"
description = "Lightweight async LLM proxy - dispatches between Anthropic and OpenAI behind a unified response type, with prompt caching and strict structured tool-call output."
readme = "README.md"
authors = [
    {name = "Dany-William TAGNE", email = "dany-william.tagne@mfglabs.com"}
]
requires-python = ">=3.11,<4.0"
license = {text = "MIT"}
keywords = ["llm", "anthropic", "openai", "claude", "router", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry]
package-mode = true
packages = [
    { include = "llm_router" }
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
anthropic = ">=0.116.0,<1.0.0"
openai = ">=1.55.0,<2.0.0"
httpx = ">=0.28.1,<1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
